version: "3.7"

services:
  creature-forger:
    image: nginx:mainline-alpine
    container_name: creature_forger
    restart: always
    networks:
      - saltbox
    volumes:
      # Map the application source code to the Nginx root
      - ./:/usr/share/nginx/html:ro
      # Nginx processes templates in /etc/nginx/templates/ into /etc/nginx/conf.d/
      - ./nginx.conf:/etc/nginx/templates/default.conf.template:ro
    environment:
      - API_KEY=${GEMINI_API_KEY}
      - DOMAIN=${DOMAIN}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-UTC}
    labels:
      - "com.github.saltbox.saltbox_managed=true"
      - "diun.enable=true"
      - "traefik.enable=true"
      - "traefik.docker.network=saltbox"

      ## Router Rules
      - "traefik.http.routers.creature-forger.rule=Host(`creatures.${DOMAIN}`)"
      - "traefik.http.routers.creature-forger.entrypoints=websecure"
      - "traefik.http.routers.creature-forger.priority=99"

      ## Middlewares (Standard Saltbox Security Headers)
      - "traefik.http.routers.creature-forger.middlewares=globalHeaders@file,secureHeaders@file,robotHeaders@file,cloudflarewarp@docker"

      ## TLS / Certs (Using 'cfdns' as per Saltbox Docs, change to 'default' if using custom)
      - "traefik.http.routers.creature-forger.tls.certresolver=cfdns"
      - "traefik.http.routers.creature-forger.tls.options=securetls@file"

      ## Service Port
      - "traefik.http.services.creature-forger.loadbalancer.server.port=80"

networks:
  saltbox:
    external: true
